<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIKKE PVP Tracker</title>
<style>
/* ── NIKKE Style Theme ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080816;
  --surface:#0e0e24;
  --card:#151530;
  --card-hover:#1c1c42;
  --primary:#00d4ff;
  --primary-dim:#0098b8;
  --primary-glow:rgba(0,212,255,.25);
  --win:#4ade80;
  --lose:#f87171;
  --text:#d8d8f0;
  --text-dim:#6a6a8e;
  --border:#222248;
  --radius:0;
  --radius-lg:0;
}
body{
  font-family:'Segoe UI','Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    linear-gradient(0deg,rgba(0,212,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,.015) 1px,transparent 1px);
  background-size:48px 48px
}
.app-header{
  background:linear-gradient(90deg,#0a0a24,#12123a);
  padding:14px 24px;display:flex;align-items:center;gap:24px;
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 20px rgba(0,212,255,.08);
  position:sticky;top:0;z-index:100
}
.app-header h1{
  font-size:18px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#00d4ff,#7b61ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px;font-weight:800
}
.app-header h1 span{
  background:var(--primary);padding:2px 8px;color:#000;font-size:10px;
  font-weight:700;letter-spacing:2px;border-radius:2px
}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab-btn{
  padding:8px 18px;border:1px solid transparent;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:13px;
  transition:all .2s;position:relative
}
.tab-btn:hover{color:var(--primary);border-color:var(--border)}
.tab-btn.active{
  color:var(--primary);border-color:var(--primary);
  box-shadow:inset 0 -1px 0 var(--primary),0 0 12px var(--primary-glow)
}
.tab-btn.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:1px;background:var(--primary);box-shadow:0 0 6px var(--primary)
}
main{max-width:1200px;margin:0 auto;padding:24px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Record Tab ── */
.record-layout{display:flex;flex-direction:column;gap:16px}
.team-section{
  background:var(--surface);padding:18px;
  border:1px solid var(--border);position:relative
}
.team-section::before{
  content:'';position:absolute;top:-1px;left:-1px;
  width:12px;height:12px;border-top:2px solid var(--primary);
  border-left:2px solid var(--primary);pointer-events:none
}
.team-section::after{
  content:'';position:absolute;bottom:-1px;right:-1px;
  width:12px;height:12px;border-bottom:2px solid var(--primary);
  border-right:2px solid var(--primary);pointer-events:none
}
.team-section h3{
  font-size:12px;color:var(--primary);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
  letter-spacing:1px;text-transform:uppercase;font-weight:600
}
.teams-row{display:flex;gap:16px}
.teams-row .team-section{flex:1;min-width:0}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{
  width:76px;height:86px;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;transition:all .2s;position:relative;
  background:var(--card);user-select:none
}
.slot.drag-over{border-color:var(--primary);background:var(--card-hover);transform:scale(1.05);box-shadow:0 0 12px var(--primary-glow)}
.slot.filled{border-color:var(--primary-dim);background:var(--card-hover)}
.slot .placeholder{font-size:24px;color:var(--text-dim);opacity:.3}
.slot .slot-name{font-size:8px;color:var(--text);text-align:center;line-height:1.1;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .slot-badge{font-size:8px;color:var(--text-dim);padding:1px 4px;background:var(--bg);border-radius:2px}
.slot .slot-avatar{width:50px;height:50px;object-fit:cover;border:1px solid var(--border)}
.slot .remove-btn{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;
  background:var(--lose);color:#fff;border:none;
  font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;
  line-height:1;z-index:3
}
.slot.filled .remove-btn{display:flex}
.team-label{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.team-label h3{margin-bottom:0}

/* ── Filters ── */
.filter-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar select{
  background:var(--card);border:1px solid var(--border);
  padding:5px 8px;color:var(--text);font-size:11px;cursor:pointer;min-width:72px
}
.filter-bar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.filter-bar input{height:28px}
.filter-bar .btn{height:28px;line-height:1}

/* ── Character Pool ── */
.char-pool{background:var(--surface);padding:18px;border:1px solid var(--border);position:relative}
.char-pool::before{
  content:'';position:absolute;top:-1px;left:-1px;
  width:12px;height:12px;border-top:2px solid var(--primary);
  border-left:2px solid var(--primary);pointer-events:none
}
.char-pool::after{
  content:'';position:absolute;bottom:-1px;right:-1px;
  width:12px;height:12px;border-bottom:2px solid var(--primary);
  border-right:2px solid var(--primary);pointer-events:none
}
.char-pool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.char-pool-header .left{display:flex;align-items:center;gap:12px}
.char-pool-header .right{display:flex;align-items:center;gap:8px}
.char-pool-header input[type=text]{
  background:var(--card);border:1px solid var(--border);
  padding:5px 10px;color:var(--text);font-size:12px;width:160px
}
.char-pool-header input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.char-grid{display:flex;flex-wrap:wrap;gap:4px;max-height:400px;overflow-y:auto;padding:4px}
.char-grid::-webkit-scrollbar{width:4px}
.char-grid::-webkit-scrollbar-thumb{background:var(--border)}
.char-card{
  width:110px;padding:8px;background:var(--card);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;
  transition:all .15s;user-select:none;position:relative
}
.char-card:hover{background:var(--card-hover);border-color:var(--primary-dim);box-shadow:0 0 8px var(--primary-glow)}
.char-card:active{cursor:grabbing;transform:scale(.92)}
.char-card img{width:85px;height:85px;object-fit:cover;border:1px solid var(--border)}
.char-card .char-name{font-size:10px;text-align:center;line-height:1.2;color:var(--text)}
.char-card .char-tag{font-size:8px;color:var(--text-dim);padding:1px 4px;background:var(--bg)}
.char-card .burst-badge{
  position:absolute;top:2px;right:2px;width:20px;height:20px;
  font-size:10px;font-weight:700;color:#000;
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:#d4d4d8;
  letter-spacing:0;line-height:1
}
.burst-B1,.burst-B2,.burst-B3,.burst-全{background:#d4d4d8;color:#000;box-shadow:0 0 4px rgba(0,0,0,.2)}
.slot .burst-badge{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;
  font-size:7px;font-weight:700;color:#000;
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:#d4d4d8;z-index:3
}
.slot-badge{display:none}
.star-btn{
  position:absolute;top:0;left:0;font-size:16px;cursor:pointer;
  background:none;border:none;padding:4px 8px;line-height:1;
  color:var(--text-dim);transition:transform .12s;z-index:2;
  min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center
}
.star-btn:hover{transform:scale(1.3)}
.star-btn.starred{color:#f0b000;text-shadow:0 0 6px rgba(240,176,0,.5)}
.char-card:has(.star-btn.starred){border-color:rgba(240,176,0,.4)}

/* ── Match Form ── */
.match-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.match-form label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)}
.match-form select,.match-form input{
  background:var(--card);border:1px solid var(--border);
  padding:5px 10px;color:var(--text);font-size:12px
}
.match-form select:focus,.match-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.btn{
  padding:7px 20px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s
}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover{background:#00b8e0;box-shadow:0 0 12px var(--primary-glow)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.btn-danger{background:var(--lose);color:#fff}
.btn-win{background:var(--win);color:#000}
.btn-lose{background:var(--lose);color:#fff}
.mt-12{margin-top:12px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.stat-card{
  background:var(--surface);padding:18px;text-align:center;
  border:1px solid var(--border);position:relative
}
.stat-card::before{
  content:'';position:absolute;top:-1px;left:-1px;
  width:10px;height:10px;border-top:2px solid var(--primary);
  border-left:2px solid var(--primary);pointer-events:none
}
.stat-card .num{font-size:30px;font-weight:700;margin:4px 0}
.stat-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat-card .num.green{color:var(--win)}
.stat-card .num.red{color:var(--lose)}
.stat-card .num.purple{color:var(--primary);text-shadow:0 0 10px var(--primary-glow)}
.stat-card .sub{font-size:10px;color:var(--text-dim);margin-top:4px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th,.data-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.data-table th{color:var(--primary);font-size:10px;position:sticky;top:0;background:var(--surface);letter-spacing:1px;text-transform:uppercase}
.data-table tr:hover{background:var(--card-hover)}
.data-table .win{color:var(--win);font-weight:600}
.data-table .lose{color:var(--lose);font-weight:600}
.cell-avatar{width:50px;height:50px;object-fit:cover;border:1px solid var(--border);border-radius:4px}
.char-td{white-space:nowrap}

/* ── Character Management ── */
.char-mgmt{display:grid;grid-template-columns:380px 1fr;gap:16px}
.char-mgmt .panel{background:var(--surface);padding:18px;border:1px solid var(--border);position:relative}
.char-mgmt .panel::before{
  content:'';position:absolute;top:-1px;left:-1px;
  width:12px;height:12px;border-top:2px solid var(--primary);
  border-left:2px solid var(--primary);pointer-events:none
}
.char-mgmt .panel h3{margin-bottom:10px;font-size:13px;color:var(--primary);letter-spacing:1px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.form-group{margin-bottom:6px}
.form-group label{display:block;font-size:10px;color:var(--text-dim);margin-bottom:2px;text-transform:uppercase;letter-spacing:1px}
.form-group input,.form-group select{width:100%;background:var(--card);border:1px solid var(--border);padding:5px 8px;color:var(--text);font-size:12px}
.form-group select{cursor:pointer}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.char-list{display:flex;flex-direction:column;gap:3px;max-height:540px;overflow-y:auto}
.char-list-item{
  display:flex;align-items:center;gap:8px;padding:5px 8px;
  background:var(--card);transition:all .12s;border:1px solid transparent
}
.char-list-item:hover{background:var(--card-hover);border-color:var(--border)}
.char-list-item .char-preview{width:85px;height:85px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.char-list-item .info{flex:1;min-width:0}
.char-list-item .info .name{font-size:12px}
.char-list-item .info .tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.char-list-item .info .tag{font-size:8px;padding:1px 4px;background:var(--bg);color:var(--text-dim)}
.char-list-item .del-btn{
  width:22px;height:22px;border:none;background:transparent;
  color:var(--lose);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;
  opacity:.3;transition:opacity .15s;flex-shrink:0
}
.char-list-item .del-btn:hover{opacity:1;background:rgba(248,113,113,.12)}

/* ── Records Tab ── */
.records-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.records-controls select,.records-controls input{
  background:var(--card);border:1px solid var(--border);
  padding:5px 10px;color:var(--text);font-size:12px
}
.records-controls select:focus,.records-controls input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
.records-table-wrap{max-height:600px;overflow-y:auto}

/* ── Import / Export ── */
.file-upload-wrap{position:relative;display:inline-block}
.file-upload-wrap input[type=file]{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;top:0;left:0}

/* ── Toast ── */
.toast{
  position:fixed;top:20px;right:20px;padding:10px 20px;
  color:#fff;font-size:13px;z-index:999;animation:slideIn .3s ease;pointer-events:none;
  border:1px solid var(--border);font-weight:600
}
.toast.success{background:rgba(74,222,128,.15);border-color:var(--win);color:var(--win)}
.toast.error{background:rgba(248,113,113,.15);border-color:var(--lose);color:var(--lose)}
.toast.info{background:rgba(0,212,255,.15);border-color:var(--primary);color:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.stats-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ── Empty State ── */
.empty-state{text-align:center;padding:36px;color:var(--text-dim)}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:.4}
.empty-state p{font-size:13px}

/* ── Responsive ── */
@media(max-width:900px){
  .stats-cols{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tabs{gap:0}
  .tab-btn{padding:8px 10px;font-size:12px}
}
@media(max-width:768px){
  .char-mgmt{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .slots{gap:4px}
  .slot{width:56px;height:68px}
  .slot .slot-avatar{width:32px;height:32px}
  .slot .slot-name{font-size:7px;max-width:50px}
  .char-card{width:68px}
  .form-row{grid-template-columns:1fr}
}
@media(max-width:600px){
  .app-header{padding:10px 12px;flex-wrap:wrap;gap:10px}
  .app-header h1{font-size:16px}
  .tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .tab-btn{flex-shrink:0;padding:6px 10px;font-size:11px}
  main{padding:12px}
  .stats-grid{grid-template-columns:1fr}
  .record-layout{gap:10px}
  .team-section{padding:12px}
  .char-grid{max-height:300px}
  .char-pool-header{flex-direction:column;align-items:stretch}
  .char-pool-header .right input{width:100%}
  .match-form{flex-direction:column;align-items:stretch}
  .match-form label{justify-content:space-between}
  .match-form select,.match-form input{width:auto;flex:1}
  .teams-row{flex-direction:column;gap:10px}
}
</style>
</head>
<body>

<div class="app-header">
  <h1>⚔️ NIKKE PVP Tracker</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('record')">📝 录战绩</button>
    <button class="tab-btn" onclick="switchTab('characters')">👤 角色</button>
    <button class="tab-btn" onclick="switchTab('stats')">📊 统计</button>
    <button class="tab-btn" onclick="switchTab('records')">📋 记录</button>
  </div>
</div>

<main>
  <!-- ════ 录战绩 ════ -->
  <div id="tab-record" class="tab-panel active">
    <div class="record-layout">

      <!-- 筛选条 -->
      <div class="char-pool">
        <div class="char-pool-header">
          <div class="left">
            <h3>👤 角色池</h3>
            <span style="font-size:12px;color:var(--text-dim)" id="pool-count"></span>
          </div>
        </div>
        <div class="filter-bar" id="filter-bar"></div>
        <div class="char-grid" id="char-pool-grid"></div>
      </div>

      <!-- 我方 + 对方并列 -->
      <div class="teams-row">
        <div class="team-section">
          <div class="team-label">
            <h3>🛡️ 我方队伍</h3>
            <span class="badge" style="background:#3b82f6;padding:2px 8px;border-radius:4px;font-size:11px;color:#fff">5/5</span>
          </div>
          <div class="slots" id="my-slots"></div>
        </div>
        <div class="team-section">
          <div class="team-label">
            <h3>⚔️ 对方队伍</h3>
            <span class="badge" style="background:#ef4444;padding:2px 8px;border-radius:4px;font-size:11px;color:#fff">5/5</span>
          </div>
          <div class="slots" id="opp-slots"></div>
        </div>
      </div>

      <!-- 表单 -->
      <div class="team-section">
        <div class="match-form">
          <label>结果
            <select id="record-result">
              <option value="win">胜利 ✅</option>
              <option value="lose">失败 ❌</option>
            </select>
          </label>
          <label>对手
            <input type="text" id="record-opponent" placeholder="对手名" size="10">
          </label>
          <button class="btn btn-primary" onclick="saveRecord()">💾 保存</button>
          <button class="btn btn-outline btn-sm" onclick="clearTeams()">🗑️ 清空</button>
          <div style="margin-left:auto;display:flex;gap:8px">
            <a class="btn btn-sm btn-outline" href="/api/records/export?format=json" download>📤 导出 JSON</a>
            <a class="btn btn-sm btn-outline" href="/api/records/export?format=csv" download>📤 导出 CSV</a>
            <div class="file-upload-wrap">
              <button class="btn btn-sm btn-outline">📥 导入 JSON</button>
              <input type="file" accept=".json" onchange="importRecords(this)">
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ════ 角色管理 ════ -->
  <div id="tab-characters" class="tab-panel">
    <div class="char-mgmt">
      <div class="panel">
        <h3>➕ 添加 / 编辑角色</h3>
        <div class="form-row">
          <div class="form-group">
            <label>角色名 *</label>
            <input type="text" id="char-name" placeholder="例：红莲">
          </div>
          <div class="form-group">
            <label>别名</label>
            <input type="text" id="char-alias" placeholder="例：scarlet">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>职业</label>
            <select id="char-class"></select>
          </div>
          <div class="form-group">
            <label>企业</label>
            <select id="char-manufacturer"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>武器</label>
            <select id="char-weapon"></select>
          </div>
          <div class="form-group">
            <label>代码</label>
            <select id="char-code"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>爆裂阶段</label>
            <select id="char-burst"></select>
          </div>
          <div class="form-group">
            <label>头像图片 URL</label>
            <input type="url" id="char-avatar-url" placeholder="https://...png" oninput="previewAvatarUrl(this.value)">
            <div id="avatar-url-preview" style="margin-top:4px"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>上传本地图片</label>
            <input type="file" id="char-avatar-input" accept="image/png,image/jpeg,image/gif,image/webp" onchange="previewAvatarFile(event)">
            <div id="avatar-file-preview" style="margin-top:4px"></div>
          </div>
          <div class="form-group" style="display:flex;align-items:flex-end">
            <span style="font-size:11px;color:var(--text-dim)">URL 优先，留空则用上传</span>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="addCharacter()">添加</button>
          <button class="btn btn-outline btn-sm" id="btn-edit-cancel" style="display:none" onclick="cancelEdit()">取消编辑</button>
        </div>
        <div id="add-char-msg" style="font-size:12px;margin-top:8px"></div>
      </div>
      <div class="panel">
        <h3>📋 已录入角色 <span style="font-size:12px;color:var(--text-dim)" id="char-count"></span></h3>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input type="text" id="char-mgmt-search" placeholder="搜索名称/别名..." oninput="renderCharMgmt()" style="background:var(--card);border:1px solid var(--border);padding:5px 10px;color:var(--text);font-size:12px;flex:1">
          <button class="btn btn-sm btn-outline" onclick="document.getElementById('char-mgmt-search').value='';renderCharMgmt()">✕ 清除</button>
        </div>
        <div class="char-list" id="char-mgmt-list"></div>
      </div>
    </div>
  </div>

  <!-- ════ 统计 ════ -->
  <div id="tab-stats" class="tab-panel">
    <div class="stats-grid" id="stats-cards"></div>
    <div class="stats-cols">
      <div class="team-section">
        <h3>🏆 角色胜率排行</h3>
        <div id="stats-by-unit"></div>
      </div>
      <div class="team-section">
        <h3>📋 阵容胜率排行</h3>
        <div id="stats-by-team"></div>
      </div>
    </div>
  </div>

  <!-- ════ 记录列表 ════ -->
  <div id="tab-records" class="tab-panel">
    <div class="records-controls">
      <select id="filter-result" onchange="renderRecords()"><option value="">全部结果</option><option value="win">胜利</option><option value="lose">失败</option></select>
      <select id="filter-records-scope" onchange="renderRecords()"><option value="all">全部字段</option><option value="my">我方</option><option value="opp">对方</option><option value="opponent">对手名</option></select>
      <select id="filter-records-logic" onchange="renderRecords()"><option value="or">OR 任一</option><option value="and">AND 全部</option><option value="not">NOT 排除</option></select>
      <input type="text" id="filter-records-q" placeholder="用空格/逗号分隔关键词..." oninput="scheduleRenderRecords()">
      <span style="font-size:12px;color:var(--text-dim)" id="records-count"></span>
    </div>
    <div class="records-table-wrap">
      <table class="data-table" id="records-table"></table>
    </div>
  </div>
</main>

<script>
// ═══════════════════ 状态 ═══════════════════
const state = {
  allCharacters: [],
  characterById: new Map(),
  avatarMap: {},
  characters: [],
  myTeam: [null,null,null,null,null],
  oppTeam: [null,null,null,null,null],
  records: [],
  enums: {},
  filters: {manufacturer:'',weapon:'',code:'',burst:'',class:''},
  poolSearch: '',
};

let editingCharId = null; // 编辑中的角色ID
let recordsRenderTimer = null;

// ═══════════════════ Toast ═══════════════════
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}

// ═══════════════════ Tab Switch ═══════════════════
function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  const map = {record:0,characters:1,stats:2,records:3};
  document.querySelectorAll('.tab-btn')[map[name]].classList.add('active');
  if(name==='stats') renderStats();
  if(name==='records') renderRecords();
  if(name==='characters') renderCharMgmt();
}

// ═══════════════════ API ═══════════════════
async function api(url, opts={}){
  const resp = await fetch(url, {
    headers:{'Content-Type':'application/json',...opts.headers},
    ...opts
  });
  if(!resp.ok){
    const err = await resp.json().catch(()=>({error:resp.statusText}));
    throw new Error(err.error || resp.statusText);
  }
  return resp.json().catch(()=>null);
}

function indexCharacters(chars){
  state.allCharacters = chars || [];
  state.characterById = new Map();
  state.avatarMap = {};
  state.allCharacters.forEach(c => {
    state.characterById.set(c.id, c);
    if(c.name) state.avatarMap[c.name] = c.avatar_url;
    if(c.alias) state.avatarMap[c.alias] = c.avatar_url;
  });
}

async function refreshAllCharacters(){
  indexCharacters(await api('/api/characters') || []);
  return state.allCharacters;
}

async function ensureAllCharacters(){
  if(!state.allCharacters.length) await refreshAllCharacters();
  return state.allCharacters;
}

function matchesPoolQuery(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  const haystack = [c.name||'', c.alias||'', c.name_simplified||''].join(' ').toLowerCase();
  return haystack.includes(q);
}

function applyCharacterFilters(){
  const el = document.getElementById('pool-search');
  if(el) state.poolSearch = el.value;
  const q = (state.poolSearch || '').trim();
  state.characters = state.allCharacters.filter(c => {
    if(state.filters.manufacturer && c.manufacturer !== state.filters.manufacturer) return false;
    if(state.filters.weapon && c.weapon !== state.filters.weapon) return false;
    if(state.filters.code && c.code !== state.filters.code) return false;
    if(state.filters.burst && c.burst !== state.filters.burst && c.burst !== '全') return false;
    if(state.filters.class && c.class !== state.filters.class) return false;
    if(state.filters.starred && !c.starred) return false;
    return matchesPoolQuery(c, q);
  });
}

// ═══════════════════ Enums ═══════════════════
async function loadEnums(){
  state.enums = await api('/api/enums') || {};
  ['class','manufacturer','weapon','code','burst'].forEach(k => {
    const key = k === 'class' ? 'classes' : k+'s';
    const opts = state.enums[key] || [];
    const sel = document.getElementById('char-'+k);
    if(!sel) return;
    sel.innerHTML = '<option value="">--</option>' +
      opts.map(v => `<option value="${v}">${k === 'burst' && v === '全' ? 'Λ' : v}</option>`).join('');
  });
  // Filter bar
  renderFilterBar();
}

function renderFilterBar(){
  const bar = document.getElementById('filter-bar');
  const en = state.enums;
  // 枚举键名映射（前端key → 后端API枚举字段）
  const enumKeys = {manufacturer:'manufacturers',weapon:'weapons',code:'codes',burst:'bursts',class:'classes'};
  const labels = {manufacturer:'企业',weapon:'武器',code:'代码',burst:'爆裂',class:'职业'};
  bar.innerHTML = Object.entries(labels).map(([k,label]) => {
    const opts = en[enumKeys[k]] || [];
    return `
    <select onchange="setFilter('${k}',this.value)">
      <option value="">${label}</option>
      ${opts.map(v => `<option value="${v}">${k === 'burst' && v === '全' ? '\u039b' : v}</option>`).join('')}
    </select>`;
  }).join('') +
  `<button class="btn btn-sm ${state.filters.starred ? 'btn-primary' : 'btn-outline'}" onclick="toggleStarFilter()">⭐ ${state.filters.starred ? '已标星' : '全部'}</button>
  <input type="text" id="pool-search" value="${escHtml(state.poolSearch)}" placeholder="搜索名称/别名...🗲" style="background:var(--card);border:1px solid var(--border);padding:5px 10px;color:var(--text);font-size:12px;width:160px;min-width:0" oninput="state.poolSearch=this.value;loadCharacters()">
  <button class="btn btn-sm btn-outline" onclick="clearFilters()">✕ 清除</button>`;
}

function toggleStarFilter(){
  state.filters.starred = state.filters.starred ? '' : '1';
  loadCharacters();
  renderFilterBar();
}

function setFilter(key, val){
  state.filters[key] = val;
  loadCharacters();
}

function clearFilters(){
  Object.keys(state.filters).forEach(k => state.filters[k]='');
  state.poolSearch = '';
  document.querySelectorAll('#filter-bar select').forEach(s => s.value='');
  const searchInput = document.getElementById('pool-search');
  if(searchInput) searchInput.value = '';
  renderFilterBar();
  loadCharacters();
}

// ═══════════════════ Characters ═══════════════════
async function loadCharacters(){
  try{
    await ensureAllCharacters();
    applyCharacterFilters();
    document.getElementById('pool-count').textContent =
      `${state.characters.length} / ${state.allCharacters.length} 个角色`;
    renderCharPool();
  }catch(e){
    console.error('loadCharacters error:', e);
    toast('⚠️ 搜索失败: '+e.message,'error');
  }
}

async function addCharacter(){
  const name = document.getElementById('char-name').value.trim();
  const msg = document.getElementById('add-char-msg');
  if(!name){msg.textContent='⚠️ 请输入角色名';msg.style.color='var(--lose)';return}
  const avatarUrl = document.getElementById('char-avatar-url').value.trim() || null;
  const data = {
    name,
    alias: document.getElementById('char-alias').value.trim() || undefined,
    class: document.getElementById('char-class').value,
    manufacturer: document.getElementById('char-manufacturer').value,
    weapon: document.getElementById('char-weapon').value,
    code: document.getElementById('char-code').value,
    burst: document.getElementById('char-burst').value,
    avatar_url: avatarUrl,
  };
  try{
    let char;
    if(editingCharId){
      // 编辑模式：PUT
      char = await api(`/api/characters/${editingCharId}`,{
        method:'PUT',body:JSON.stringify(data)
      });
    } else {
      // 添加模式：POST
      char = await api('/api/characters',{
        method:'POST',body:JSON.stringify(data)
      });
    }
    // 编辑和添加均支持文件上传
    if(!avatarUrl){
      const fileInput = document.getElementById('char-avatar-input');
      if(fileInput.files.length){
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        await fetch(`/api/characters/${char.id}/avatar`, {method:'POST', body:fd});
      }
    }
    msg.textContent='✅ 保存成功';
    clearCharForm();
    msg.style.color='var(--win)';
    await refreshAllCharacters();
    await loadCharacters();
    renderCharMgmt();
  }catch(e){
    msg.textContent=`⚠️ ${e.message}`;
    msg.style.color='var(--lose)';
  }
}
function clearCharForm(){
  editingCharId = null;
  document.getElementById('char-name').value='';
  document.getElementById('char-alias').value='';
  document.querySelectorAll('#char-class,#char-manufacturer,#char-weapon,#char-code,#char-burst').forEach(s=>s.value='');
  document.getElementById('char-avatar-url').value='';
  document.getElementById('char-avatar-input').value='';
  document.getElementById('avatar-url-preview').innerHTML='';
  document.getElementById('avatar-file-preview').innerHTML='';
  document.getElementById('btn-edit-cancel').style.display='none';
  document.querySelector('#tab-characters .panel h3').textContent = '➕ 添加 / 编辑角色';
  document.querySelector('#tab-characters .btn-primary').textContent = '添加';
}

function cancelEdit(){clearCharForm()}

// ═══════════════════ Char Pool ═══════════════════
async function editCharacter(id){
  await ensureAllCharacters();
  const c = state.characterById.get(id);
  if(!c){toast('❌ 角色不存在','error');return}
  editingCharId = id;
  document.getElementById('char-name').value = c.name;
  document.getElementById('char-alias').value = c.alias || '';
  document.getElementById('char-class').value = c.class || '';
  document.getElementById('char-manufacturer').value = c.manufacturer || '';
  document.getElementById('char-weapon').value = c.weapon || '';
  document.getElementById('char-code').value = c.code || '';
  document.getElementById('char-burst').value = c.burst || '';
  document.getElementById('char-avatar-url').value = c.avatar_url || '';
  document.getElementById('avatar-url-preview').innerHTML = c.avatar_url
    ? `<img src="${c.avatar_url}" style="max-width:80px;border-radius:4px">`
    : '';
  document.getElementById('btn-edit-cancel').style.display = 'inline-block';
  document.querySelector('#tab-characters .panel h3').textContent = '✏️ 编辑角色';
  document.querySelector('#tab-characters .btn-primary').textContent = '保存修改';
}

async function deleteCharacter(id){
  if(!confirm('确定删除该角色？')) return;
  await api(`/api/characters/${id}`,{method:'DELETE'});
  for(let i=0;i<5;i++){
    if(state.myTeam[i] && state.myTeam[i].id===id) state.myTeam[i]=null;
    if(state.oppTeam[i] && state.oppTeam[i].id===id) state.oppTeam[i]=null;
  }
  renderSlots();
  await refreshAllCharacters();
  await loadCharacters();
  renderCharMgmt();
}

function previewAvatarFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('avatar-file-preview').innerHTML =
      `<img src="${ev.target.result}" style="width:50px;height:50px;border-radius:6px;object-fit:cover;border:2px solid var(--primary)" title="本地图片预览">`;
  };
  reader.readAsDataURL(file);
}

function previewAvatarUrl(url){
  const div = document.getElementById('avatar-url-preview');
  if(!url){
    div.innerHTML='';
    return;
  }
  div.innerHTML = `<img src="${url}" style="width:50px;height:50px;border-radius:6px;object-fit:cover;border:2px solid var(--primary)" title="URL 图片预览" onerror="this.outerHTML='<span style=\\'font-size:11px;color:var(--lose)\\'>图片加载失败</span>'">`;
}

// ═══════════════════ Char Pool ═══════════════════
function renderCharPool(){
  const grid = document.getElementById('char-pool-grid');
  const chars = state.characters;
  grid.innerHTML = chars.map(c => `
    <div class="char-card" draggable="true"
         data-id="${c.id}"
         ondragstart="onCharDragStart(event,'${c.id}')">
      <button class="star-btn ${c.starred?'starred':''}" onclick="event.stopPropagation();toggleStar('${c.id}')">${c.starred?'⭐':'☆'}</button>
      ${c.avatar_url
        ? `<img src="${c.avatar_url}" alt="${c.name}" loading="lazy" decoding="async" onerror="this.outerHTML=fallbackAvatar('${c.name}',85)">`
        : fallbackAvatar(c.name,85)
      }
      ${c.burst ? `<div class="burst-badge burst-${c.burst}">${burstLabel(c.burst)}</div>` : ''}
      <div class="char-name">${c.name}</div>
      ${c.weapon ? `<div class="char-tag">${c.weapon}</div>` : ''}
    </div>
  `).join('');
}

async function toggleStar(charId){
  const result = await api(`/api/characters/${charId}/toggle-star`,{method:'POST'});
  if(result && result.status === 'ok'){
    const c = state.characters.find(x => x.id === charId);
    if(c) c.starred = result.starred;
    const full = state.characterById.get(charId);
    if(full) full.starred = result.starred;
    renderCharPool();
  }
}

function fallbackAvatar(name, size){
  size = size || 48;
  const color = hashColor(name);
  const initial = name.charAt(0) || '?';
  const fontSize = Math.round(size * 0.46);
  const y = Math.round(size * 0.65);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="border-radius:4px;flex-shrink:0">
    <rect width="${size}" height="${size}" fill="${color}" rx="4"/>
    <text x="${size/2}" y="${y}" text-anchor="middle" font-size="${fontSize}" fill="white" font-family="sans-serif" font-weight="600">${escHtml(initial)}</text>
  </svg>`;
}

function onCharDragStart(e, charId){
  e.dataTransfer.setData('text/plain', charId);
  e.dataTransfer.effectAllowed = 'copy';
}

function hashColor(name){
  let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h);
  const colors=['#7b61ff','#3b82f6','#ef4444','#4ade80','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#84cc16','#14b8a6'];
  return colors[Math.abs(h)%colors.length];
}
function burstLabel(b){
  const map={B1:'Ⅰ',B2:'Ⅱ',B3:'Ⅲ',全:'Λ'};
  return map[b]||b;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ═══════════════════ Slots ═══════════════════
function initSlots(){
  renderSlots();
}

function renderSlots(){
  ['my','opp'].forEach(side => {
    const container = document.getElementById(`${side}-slots`);
    const team = side==='my' ? state.myTeam : state.oppTeam;
    container.innerHTML = team.map((char, i) => {
      const filled = char !== null;
      return `
        <div class="slot ${filled?'filled':''}"
             data-side="${side}" data-index="${i}"
             ondragover="onSlotDragOver(event)"
             ondragleave="onSlotDragLeave(event)"
             ondrop="onSlotDrop(event,'${side}',${i})"
             onclick="onSlotClick('${side}',${i})">
          ${filled ? `
            <img class="slot-avatar" src="${char.avatar_url||''}"
                 alt="${char.name}"
                 decoding="async"
                 onerror="this.outerHTML=fallbackAvatar('${char.name}')">
            <div class="slot-name">${char.name}</div>
            ${char.burst ? `<div class="burst-badge burst-${char.burst}">${burstLabel(char.burst)}</div>` : ''}
            <button class="remove-btn" onclick="event.stopPropagation();removeFromSlot('${side}',${i})">✕</button>
          ` : `
            <div class="placeholder">+</div>
            <div class="slot-name" style="color:var(--text-dim)">拖入</div>
          `}
        </div>
      `;
    }).join('');
  });
}

// ═══════════════════ Slot Helpers ═══════════════════
function onSlotDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='copy';e.currentTarget.classList.add('drag-over')}
function onSlotDragLeave(e){e.currentTarget.classList.remove('drag-over')}

function onSlotDrop(e, side, index){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const charId = e.dataTransfer.getData('text/plain');
  const char = state.characterById.get(charId) || state.characters.find(c=>c.id===charId);
  if(!char) return;
  const team = side==='my' ? state.myTeam : state.oppTeam;
  team[index] = char;
  renderSlots();
}

function onSlotClick(side, index){
  const team = side==='my' ? state.myTeam : state.oppTeam;
  if(team[index]) {team[index]=null;renderSlots()}
}

function removeFromSlot(side, index){
  const team = side==='my' ? state.myTeam : state.oppTeam;
  team[index]=null;renderSlots();
}

function clearTeams(){
  for(let i=0;i<5;i++){state.myTeam[i]=null;state.oppTeam[i]=null}
  renderSlots();
}

// ═══════════════════ Save Record ═══════════════════
async function saveRecord(){
  const my = state.myTeam.filter(Boolean);
  const opp = state.oppTeam.filter(Boolean);
  if(my.length!==5) return toast('我方需要 5 个角色！','error');
  if(opp.length!==5) return toast('对方需要 5 个角色！','error');
  try{
    await api('/api/records',{method:'POST',body:JSON.stringify({
      my_team: my.map(c=>c.name),
      opp_team: opp.map(c=>c.name),
      result: document.getElementById('record-result').value,
      opponent: document.getElementById('record-opponent').value.trim()||'未知',
    })});
    toast('✅ 保存成功','success');
    clearTeams();
  }catch(e){toast(`⚠️ ${e.message}`,'error')}
}

// ═══════════════════ Import / Export ═══════════════════
async function importRecords(input){
  const file = input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data)) throw new Error('需要 JSON 数组');
    toast(`正在导入 ${data.length} 条记录...`,'info');
    const fd = new FormData();
    fd.append('file', file);
    const resp = await fetch('/api/records/import', {method:'POST', body:fd});
    const result = await resp.json();
    if(result.status==='ok'){
      toast(`✅ 导入 ${result.imported} 条（共 ${result.total} 条）`,'success');
    }else{
      toast(`⚠️ 导入失败: ${result.error}`,'error');
    }
  }catch(e){
    toast(`⚠️ 导入失败: ${e.message}`,'error');
  }
  input.value='';
}

// ═══════════════════ Stats ═══════════════════
async function renderStats(){
  await ensureAllCharacters();
  const [overview, byUnit, byTeam] = await Promise.all([
    api('/api/stats/overview'),api('/api/stats/by-unit'),api('/api/stats/by-team'),
  ]);
  if(!overview) return;
  const avatarMap = state.avatarMap;
  document.getElementById('stats-cards').innerHTML = `
    <div class="stat-card"><div class="label">总场次</div><div class="num purple">${overview.total}</div></div>
    <div class="stat-card"><div class="label">总胜率</div><div class="num ${overview.win_rate>=50?'green':'red'}">${overview.win_rate}%</div><div class="sub">${overview.wins}W / ${overview.losses}L</div></div>
  `;
  const unitDiv = document.getElementById('stats-by-unit');
  unitDiv.innerHTML = (byUnit||[]).length ? `
    <table class="data-table"><tr><th>角色</th><th>出场</th><th>胜率</th></tr>
    ${(byUnit||[]).slice(0,40).map(u => `
      <tr><td class="char-td">${avatarCell(u.name, avatarMap[u.name])}</td><td>${u.appearances}</td>
      <td class="${u.win_rate>=50?'win':'lose'}">${u.win_rate}%</td></tr>
    `).join('')}</table>
  ` : '<div class="empty-state"><p>暂无数据</p></div>';
  const teamDiv = document.getElementById('stats-by-team');
  teamDiv.innerHTML = (byTeam||[]).length ? `
    <table class="data-table"><tr><th>阵容</th><th>场次</th><th>胜率</th></tr>
    ${(byTeam||[]).slice(0,40).map(t => `
      <tr><td>${t.team.map(n=>`${avatarCell(n, avatarMap[n])}`).join('')}</td>
      <td>${t.appearances}</td>
      <td class="${t.win_rate>=50?'win':'lose'}">${t.win_rate}%</td></tr>
    `).join('')}</table>
  ` : '<div class="empty-state"><p>暂无数据</p></div>';
}
function avatarCell(name, url){
  if(url) return `<img class="cell-avatar" src="${url}" alt="${escHtml(name)}" loading="lazy" decoding="async" onerror="this.outerHTML=''"> `;
  return '';
}

// ═══════════════════ Records List ═══════════════════
function scheduleRenderRecords(){
  clearTimeout(recordsRenderTimer);
  recordsRenderTimer = setTimeout(renderRecords, 180);
}

async function renderRecords(){
  await ensureAllCharacters();
  const params = new URLSearchParams({limit:'200'});
  const r = document.getElementById('filter-result').value; if(r) params.set('result',r);
  const scope = document.getElementById('filter-records-scope').value; if(scope) params.set('q_scope',scope);
  const logic = document.getElementById('filter-records-logic').value; if(logic) params.set('q_logic',logic);
  const q = document.getElementById('filter-records-q').value.trim(); if(q) params.set('q',q);
  const records = await api(`/api/records?${params}`) || [];
  const avatarMap = state.avatarMap;
  document.getElementById('records-count').textContent = `共 ${records.length} 条`;
  const table = document.getElementById('records-table');
  if(!records.length){table.innerHTML='<div class="empty-state"><p>暂无对战记录</p></div>';return}
  table.innerHTML = `<tr><th>时间</th><th>结果</th><th>对手</th><th>我方</th><th>对方</th><th></th></tr>
    ${records.map(r => `
      <tr>
        <td style="font-size:11px;color:var(--text-dim)">${fmtTime(r.timestamp)}</td>
        <td class="${r.result}">${r.result==='win'?'✅ 胜利':'❌ 失败'}</td>
        <td>${r.opponent}</td>
        <td>${r.my_team.map(n=>`${avatarCell(n, avatarMap[n])}`).join(' ')}</td>
        <td>${r.opp_team.map(n=>`${avatarCell(n, avatarMap[n])}`).join(' ')}</td>
        <td><button class="btn btn-sm btn-outline" onclick="deleteRecord('${r.id}')">🗑️</button></td>
      </tr>
    `).join('')}`;
}

async function deleteRecord(id){
  if(!confirm('删除这条记录？')) return;
  await api(`/api/records/${id}`,{method:'DELETE'});
  toast('已删除','info');
  renderRecords();
}

function fmtTime(ts){
  try{return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return ts}
}

// ═══════════════════ Character Management List ═══════════════════
function renderCharMgmt(){
  (async ()=>{
    await ensureAllCharacters();
    const q = document.getElementById('char-mgmt-search').value.trim();
    const all = q ? state.allCharacters.filter(c => matchesPoolQuery(c, q)) : state.allCharacters;
    document.getElementById('char-count').textContent = q
      ? `(${all.length} / 过滤)`
      : `(${all.length})`;
    const list = document.getElementById('char-mgmt-list');
    list.innerHTML = all.length ? all.map(c => {
      const tags = [c.class, c.manufacturer, c.weapon, c.code, c.burst].filter(Boolean);
      return `
        <div class="char-list-item">
          ${c.avatar_url
            ? `<img class="char-preview" src="${c.avatar_url}" alt="${c.name}" loading="lazy" decoding="async" onerror="this.outerHTML=fallbackAvatar('${c.name}',85)">`
            : fallbackAvatar(c.name,85)
          }
          <div class="info">
            <div class="name">${c.name} ${c.alias ? `<span style="color:var(--text-dim);font-size:11px">📎${c.alias}</span>`:''}</div>
            <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-outline btn-xs" onclick="editCharacter('${c.id}')" title="编辑" style="padding:2px 6px;font-size:12px">✎</button>
            <button class="del-btn" onclick="deleteCharacter('${c.id}')" title="删除">✕</button>
          </div>
        </div>
      `;
    }).join('') : '<div class="empty-state"><p>尚未添加角色</p></div>';
  })();
}

// ═══════════════════ Init ═══════════════════
(async function init(){
  await loadEnums();
  await refreshAllCharacters();
  await loadCharacters();
  initSlots();
})();
</script>
