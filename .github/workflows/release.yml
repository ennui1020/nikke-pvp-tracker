name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.4)'
        required: true
        default: 'v1.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --clean --noconfirm nikke-pvp-tracker.spec

      - name: Create zip package
        run: |
          cd dist/nikke-pvp-tracker
          zip -r ../../nikke-pvp-tracker-${{ github.event.inputs.version }}.zip .

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to create release; if it exists, delete old asset first
          if ! gh release view ${{ github.event.inputs.version }} &>/dev/null; then
            gh release create ${{ github.event.inputs.version }} \
              nikke-pvp-tracker-${{ github.event.inputs.version }}.zip \
              --title ${{ github.event.inputs.version }} \
              --generate-notes
          else
            # Delete existing zip asset if present
            ASSET_ID=$(gh release view ${{ github.event.inputs.version }} \
              --json assets \
              -q '.assets[] | select(.name == "nikke-pvp-tracker-${{ github.event.inputs.version }}.zip") | .id' 2>/dev/null)
            if [ -n "$ASSET_ID" ]; then
              gh release delete-assets ${{ github.event.inputs.version }} --asset "nikke-pvp-tracker-${{ github.event.inputs.version }}.zip" &>/dev/null || true
            fi
            gh release upload ${{ github.event.inputs.version }} \
              nikke-pvp-tracker-${{ github.event.inputs.version }}.zip
          fi
